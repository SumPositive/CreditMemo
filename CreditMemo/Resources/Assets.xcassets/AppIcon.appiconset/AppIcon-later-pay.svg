<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- 背景: 小豆色 -->
    <linearGradient id="bgVertical" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B4A44"/>
      <stop offset="1" stop-color="#9B4A44"/>
    </linearGradient>
    <radialGradient id="bgGlowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 280) rotate(90) scale(340 820)">
      <stop offset="0" stop-color="#B5605A" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#B5605A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 800) rotate(90) scale(340 820)">
      <stop offset="0" stop-color="#B5605A" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#B5605A" stop-opacity="0"/>
    </radialGradient>

    <!-- AppIconBadge と同形: 中央の円で 3 色帯をクリップ -->
    <clipPath id="badgeCircle">
      <circle cx="512" cy="512" r="400"/>
    </clipPath>
  </defs>

  <!-- 背景: 小豆色＋上下の微発光 -->
  <rect width="1024" height="1024" fill="url(#bgVertical)"/>
  <rect width="1024" height="1024" fill="url(#bgGlowTop)"/>
  <rect width="1024" height="1024" fill="url(#bgGlowBottom)"/>

  <!-- 中央の AppIconBadge（モノブルー = デフォルトプリセット）-->
  <!-- 円: r=400, 中央 (512,512), 高さ 800px -->
  <!-- 中央バンド: 16/64 * 800 = 200px。上下バンド: 300px ずつ -->
  <g clip-path="url(#badgeCircle)">
    <!-- 上: 明るいブルー #5BB0FF -->
    <rect x="112" y="112" width="800" height="300" fill="#5BB0FF"/>
    <!-- 中: Apple ブルー #0A84FF -->
    <rect x="112" y="412" width="800" height="200" fill="#0A84FF"/>
    <!-- 下: 深ネイビー #003D80 -->
    <rect x="112" y="612" width="800" height="300" fill="#003D80"/>
  </g>
</svg>
