<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bgVertical" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B4A44"/>
      <stop offset="0.52" stop-color="#9B4A44"/>
      <stop offset="1" stop-color="#9B4A44"/>
    </linearGradient>
    <radialGradient id="bgGlowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 280) rotate(90) scale(340 820)">
      <stop offset="0" stop-color="#B5605A" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#B5605A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 800) rotate(90) scale(340 820)">
      <stop offset="0" stop-color="#B5605A" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#B5605A" stop-opacity="0"/>
    </radialGradient>

    <!-- 円内上半分: 金茶（上端が明るく、境界に近づくほど深い） -->
    <linearGradient id="circleTop" x1="512" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4A848"/>
      <stop offset="0.45" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#8B6308"/>
    </linearGradient>

    <!-- 円内下半分: グレージュ（境界が深く、下端が明るい） -->
    <linearGradient id="circleBottom" x1="512" y1="512" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E635A"/>
      <stop offset="0.45" stop-color="#8B7E74"/>
      <stop offset="1" stop-color="#A89A8E"/>
    </linearGradient>

    <!-- コインの上端ツヤ -->
    <radialGradient id="coinShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 120) rotate(90) scale(180 380)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 内側影で縁を締める -->
    <radialGradient id="innerShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.88" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>

    <!-- 中央クリーム発光ライン -->
    <linearGradient id="centerGlow" x1="0" y1="512" x2="1024" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5EBD8" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#F5EBD8" stop-opacity="1.0"/>
      <stop offset="1" stop-color="#F5EBD8" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="lineGlow" x="-10%" y="-500%" width="120%" height="1100%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- 矢印用クリーム塗り -->
    <linearGradient id="arrowFill" x1="350" y1="160" x2="674" y2="864" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8F1"/>
      <stop offset="1" stop-color="#FFF0DA"/>
    </linearGradient>

    <filter id="arrowGlow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.98 0 1 0 0 0.89 0 0 1 0 0.74 0 0 0 1 0"/>
    </filter>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.032"/>
      </feComponentTransfer>
    </filter>

    <!-- キャンバス中央のコイン（r=420, 中心 512,512 → x=92..932、左右に 92px の余白） -->
    <clipPath id="centerCircle">
      <circle cx="512" cy="512" r="420"/>
    </clipPath>
  </defs>

  <!-- 背景: 小豆色 -->
  <rect width="1024" height="1024" fill="url(#bgVertical)"/>
  <rect width="1024" height="1024" fill="url(#bgGlowTop)"/>
  <rect width="1024" height="1024" fill="url(#bgGlowBottom)"/>

  <!-- 中央コイン -->
  <g clip-path="url(#centerCircle)">
    <!-- 上半円: 金茶グラデ -->
    <rect x="0" y="0" width="1024" height="512" fill="url(#circleTop)"/>
    <!-- 下半円: グレージュグラデ -->
    <rect x="0" y="512" width="1024" height="512" fill="url(#circleBottom)"/>
    <!-- 上端ツヤ -->
    <rect x="0" y="0" width="1024" height="512" fill="url(#coinShine)"/>
    <!-- 内側影で縁を締める -->
    <rect x="92" y="92" width="840" height="840" fill="url(#innerShade)"/>
  </g>

  <!-- 中央クリーム発光ライン（円の外まで左右一杯に伸ばす） -->
  <g filter="url(#lineGlow)">
    <rect x="0" y="506" width="1024" height="12" fill="url(#centerGlow)"/>
  </g>
  <rect x="0" y="508" width="1024" height="8" fill="url(#centerGlow)"/>

  <!-- 上半円: 下矢印（未払=これから引き落とされる） SF Symbol 風の柔らかい線 -->
  <g filter="url(#arrowGlow)">
    <path d="M 512 160 L 512 310 M 400 246 L 512 350 L 624 246"
          stroke="url(#arrowFill)" stroke-width="76"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M 512 160 L 512 310 M 400 246 L 512 350 L 624 246"
        stroke="url(#arrowFill)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 下半円: 上矢印（済み=引き落とし完了） -->
  <g filter="url(#arrowGlow)">
    <path d="M 512 864 L 512 714 M 400 778 L 512 674 L 624 778"
          stroke="url(#arrowFill)" stroke-width="76"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M 512 864 L 512 714 M 400 778 L 512 674 L 624 778"
        stroke="url(#arrowFill)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
