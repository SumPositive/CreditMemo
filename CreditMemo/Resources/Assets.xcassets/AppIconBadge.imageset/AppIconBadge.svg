<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="badgeCircle">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeCircle)">
    <!-- 上半: ブライトブルー -->
    <rect x="0" y="0" width="64" height="32" fill="#0A84FF"/>
    <!-- 下半: ネイビー -->
    <rect x="0" y="32" width="64" height="32" fill="#3D5A80"/>
    <!-- 中央の境界線（小豆色） -->
    <rect x="0" y="31" width="64" height="2" fill="#9B4A44"/>
  </g>
</svg>
