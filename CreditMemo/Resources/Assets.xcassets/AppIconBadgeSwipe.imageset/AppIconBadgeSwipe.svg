<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- 上半円: 金茶 3 段グラデ -->
    <linearGradient id="topGrad" x1="32" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4A848"/>
      <stop offset="0.45" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#8B6308"/>
    </linearGradient>
    <!-- 下半円: グレージュ 3 段グラデ -->
    <linearGradient id="bottomGrad" x1="32" y1="32" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E635A"/>
      <stop offset="0.45" stop-color="#8B7E74"/>
      <stop offset="1" stop-color="#A89A8E"/>
    </linearGradient>
    <!-- 上端ツヤ -->
    <radialGradient id="coinShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 4) scale(28 18)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 内側影 -->
    <radialGradient id="innerShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="64" height="32" fill="url(#topGrad)"/>
    <rect x="0" y="32" width="64" height="32" fill="url(#bottomGrad)"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#coinShine)"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#innerShade)"/>

    <!-- 中央クリーム発光ライン -->
    <rect x="0" y="31.5" width="64" height="1" fill="#F5EBD8"/>

    <!-- 下矢印 彫り込み: ハイライト → ダーク影 -->
    <path d="M 32 11.13 L 32 20.27 M 25.14 16.38 L 32 22.70 L 38.86 16.38"
          transform="translate(0.7 1.0)"
          stroke="#FFF5DC" stroke-opacity="0.92" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 32 11.13 L 32 20.27 M 25.14 16.38 L 32 22.70 L 38.86 16.38"
          stroke="#0F0903" stroke-opacity="0.80" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 上矢印 彫り込み -->
    <path d="M 32 52.88 L 32 43.73 M 25.14 47.62 L 32 41.30 L 38.86 47.62"
          transform="translate(0.7 1.0)"
          stroke="#FFF5DC" stroke-opacity="0.92" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 32 52.88 L 32 43.73 M 25.14 47.62 L 32 41.30 L 38.86 47.62"
          stroke="#0F0903" stroke-opacity="0.80" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
