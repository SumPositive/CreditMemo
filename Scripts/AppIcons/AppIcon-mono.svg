<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- 背景: カルメモ（Calclin）と同じ小豆色の斜めグラデーション -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#bd5f57"/><stop offset="0.5" stop-color="#9c4842"/><stop offset="1" stop-color="#6f2e2c"/>
    </linearGradient>
    <radialGradient id="canDome" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 380) scale(500 480)">
      <stop offset="0" stop-color="white" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="white" stop-opacity="0.06"/>
      <stop offset="1" stop-color="black" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="canTopShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 220) scale(300 180)">
      <stop offset="0" stop-color="white" stop-opacity="0.70"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.20"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="canBottomShadow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 820) scale(420 240)">
      <stop offset="0" stop-color="black" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="black" stop-opacity="0.10"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="canRim" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) scale(400 400)">
      <stop offset="0.86" stop-color="black" stop-opacity="0"/>
      <stop offset="0.96" stop-color="black" stop-opacity="0.30"/>
      <stop offset="1" stop-color="black" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="badgeCircle">
      <circle cx="512" cy="512" r="400"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g clip-path="url(#badgeCircle)">
    <rect x="112" y="112" width="800" height="300" fill="#5A5A5A"/>
    <rect x="112" y="412" width="800" height="200" fill="#9C9C9C"/>
    <rect x="112" y="612" width="800" height="300" fill="#1F1F1F"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#canDome)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#canBottomShadow)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#canTopShine)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#canRim)"/>
  </g>
</svg>
